<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1242px;height:1656px;overflow:hidden}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#202438;-webkit-font-smoothing:antialiased}
  .wrap{position:relative;width:1242px;height:1656px;overflow:hidden;
        background:linear-gradient(158deg,#F7F8FC 0%,#EEECFF 58%,#E6E3FB 100%)}
  .violet{background:linear-gradient(158deg,#6E62EC 0%,#6255E7 46%,#4E42C4 100%)}
  .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55}
  .chips{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
  .chip{background:#fff;border:2px solid #E4E1F7;color:#5549C7;font-weight:700;
        border-radius:999px;padding:16px 30px;font-size:30px;box-shadow:0 6px 18px rgba(98,85,231,.10)}
  .chip.on{background:#6255E7;border-color:#6255E7;color:#fff}
</style></head><body><div class="wrap">
  <div class="blob" style="width:460px;height:460px;background:#DCD6FF;right:-150px;top:-140px"></div>
  <div style="position:absolute;left:88px;right:88px;top:110px">
    <div style="font-size:34px;font-weight:800;color:#8B84B8;letter-spacing:4px">OPEN BLACK · 真实日常</div>
    <div style="font-size:100px;font-weight:900;margin-top:26px">说的是不是你？</div>
    <div style="margin-top:66px;display:flex;flex-direction:column;gap:34px">
      
      <div style="background:#fff;border-radius:38px;padding:44px 46px;display:flex;gap:32px;align-items:flex-start;
        box-shadow:0 16px 40px rgba(98,85,231,.10);border:2px solid #F0EEFB">
        <div style="flex:0 0 78px;height:78px;border-radius:26px;background:#FFF0F2;color:#C54D69;
          font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center">1</div>
        <div>
          <div style="font-size:52px;font-weight:800;line-height:1.25">喊了半天，没人应</div>
          <div style="font-size:34px;color:#777E92;line-height:1.5;margin-top:14px">群里喊一句「还缺两个」，两分钟后被段子和表情包刷走</div>
        </div>
      </div>
      <div style="background:#fff;border-radius:38px;padding:44px 46px;display:flex;gap:32px;align-items:flex-start;
        box-shadow:0 16px 40px rgba(98,85,231,.10);border:2px solid #F0EEFB">
        <div style="flex:0 0 78px;height:78px;border-radius:26px;background:#FFF0F2;color:#C54D69;
          font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center">2</div>
        <div>
          <div style="font-size:52px;font-weight:800;line-height:1.25">信息对不上</div>
          <div style="font-size:34px;color:#777E92;line-height:1.5;margin-top:14px">房间号、人数、时间写在三条消息里，谁也看不明白</div>
        </div>
      </div>
      <div style="background:#fff;border-radius:38px;padding:44px 46px;display:flex;gap:32px;align-items:flex-start;
        box-shadow:0 16px 40px rgba(98,85,231,.10);border:2px solid #F0EEFB">
        <div style="flex:0 0 78px;height:78px;border-radius:26px;background:#FFF0F2;color:#C54D69;
          font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center">3</div>
        <div>
          <div style="font-size:52px;font-weight:800;line-height:1.25">一个个私聊回</div>
          <div style="font-size:34px;color:#777E92;line-height:1.5;margin-top:14px">有人想上车，还得挨个问「还缺吗」「几点」「房间号多少」</div>
        </div>
      </div>
      <div style="background:#fff;border-radius:38px;padding:44px 46px;display:flex;gap:32px;align-items:flex-start;
        box-shadow:0 16px 40px rgba(98,85,231,.10);border:2px solid #F0EEFB">
        <div style="flex:0 0 78px;height:78px;border-radius:26px;background:#FFF0F2;color:#C54D69;
          font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center">4</div>
        <div>
          <div style="font-size:52px;font-weight:800;line-height:1.25">等着等着就散了</div>
          <div style="font-size:34px;color:#777E92;line-height:1.5;margin-top:14px">等把消息回完，人早就去打别的了</div>
        </div>
      </div>
    </div>
    <div style="text-align:center;margin-top:60px;font-size:32px;font-weight:700;color:#8B84B8">
      这些，本来都不该是问题 →
    </div>
  </div>
</div></body></html>
